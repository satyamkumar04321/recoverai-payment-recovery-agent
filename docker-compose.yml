version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=sqlite:////app/data/recoverai.db
      - ML_MODEL_PATH=/app/ml/model.joblib
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recoverai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
