services:
  # Backend API Service
  - type: web
    name: recoverai-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python ml/generate_data.py && python ml/train.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./data/recoverai.db
      - key: ML_MODEL_PATH
        value: ./ml/model.joblib

  # Frontend Static Site
  - type: web
    name: recoverai-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
